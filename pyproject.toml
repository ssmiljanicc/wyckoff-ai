[project]
name = "wyckoff-ai"
version = "0.1.0"
description = "Wyckoff methodology AI skill — knowledge base, raw data scripts, and MCP servers"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "httpx>=0.28",
    "mcp[cli]>=1.0",
]

[project.optional-dependencies]
book = ["pymupdf>=1.24"]
vision = ["anthropic>=0.40"]
mcp = ["matplotlib>=3.9", "mplfinance>=0.12"]

[tool.uv]
package = false
